services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pinghub
      POSTGRES_PASSWORD: pinghub
      POSTGRES_DB: pinghub
    ports:
      - "5432:5432"
    volumes:
      - pinghub-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinghub"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pinghub-postgres:
